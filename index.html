<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16201a">
  <title>Warrior Match-3</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Stockpile bar (banked resources at home): visible on every screen -->
    <header id="stockbar">
      <div class="res" data-res="wood"><span class="chip c-wood"></span><b id="s-wood">0</b></div>
      <div class="res" data-res="stone"><span class="chip c-stone"></span><b id="s-stone">0</b></div>
      <div class="res" data-res="hide"><span class="chip c-hide"></span><b id="s-hide">0</b></div>
      <div class="res" data-res="food"><span class="chip c-food"></span><b id="s-food">0</b></div>
      <div class="res" data-res="gold"><span class="chip c-gold"></span><b id="s-gold">0</b></div>
      <div class="res" data-res="iron"><span class="chip c-iron"></span><b id="s-iron">0</b></div>
      <button id="sound-btn" class="sound-btn" aria-label="Sound">🔊</button>
      <div id="sound-toast" class="sound-toast"></div>
    </header>

    <!-- HOME -->
    <section id="screen-home" class="screen">
      <h1>Warrior Match-3</h1>
      <p class="sub">Gather → Craft → Fortify → Raid</p>

      <nav class="menu">
        <button class="big" id="btn-forest">🌲 Gather in the Forest</button>
        <button class="big" id="btn-craft">🔨 Craft</button>
        <button class="big" id="btn-raid">⚔️ Raid Goblin Village</button>
        <button class="big" disabled>⛏️ Dwarf Stronghold <small>later</small></button>
        <button class="big" disabled>🧱 Fortify <small>later</small></button>
      </nav>

      <div class="panel">
        <h3>Inventory</h3>
        <div id="home-inventory" class="inv"></div>
        <h3 class="mt">Goblin spoils</h3>
        <div id="home-spoils" class="inv"></div>
      </div>

      <div class="panel debug">
        <h3>🛠 Debug</h3>
        <label class="check"><input type="checkbox" id="dbg-tracks"> 🐾 Goblin tracks appear right away in the forest</label>
        <button class="big alt" id="dbg-village" style="margin-top:10px">+1 marked village &amp; +5 food</button>
        <button class="big alt" id="dbg-rich" style="margin-top:10px">+20 of every resource</button>
        <button class="link" id="btn-reset">Reset save</button>
      </div>
    </section>

    <!-- FOREST (gathering) -->
    <section id="screen-forest" class="screen hidden">
      <div class="forest-top">
        <button class="small" id="forest-exit">🏠 Head home</button>
        <div class="moves">Moves <b id="f-moves">20</b></div>
      </div>

      <div class="backpack" id="backpack">
        <span class="bp-label">🎒 <b id="bp-total">0</b>/<span id="bp-cap">15</span></span>
        <span class="bp-item"><span class="chip c-wood"></span><b id="bp-wood">0</b></span>
        <span class="bp-item"><span class="chip c-stone"></span><b id="bp-stone">0</b></span>
        <span class="bp-item"><span class="chip c-hide"></span><b id="bp-hide">0</b></span>
        <span class="bp-item"><span class="chip c-food"></span><b id="bp-food">0</b></span>
        <span class="bp-item"><span class="chip c-gold"></span><b id="bp-gold">0</b></span>
      </div>

      <div class="board-wrap" id="forest-wrap">
        <div class="board"></div>
        <div class="board-fx"></div>
        <div class="toast"></div>
      </div>

      <div class="weapons">
        <span class="label">Weapons</span>
        <div id="forest-weapons" class="weapon-tray"></div>
      </div>
      <p class="hint" id="forest-hint"></p>
    </section>

    <!-- GOBLIN VILLAGE (battle) -->
    <section id="screen-battle" class="screen hidden">
      <div class="forest-top">
        <button class="small danger" id="battle-exit">🏳️ Retreat</button>
        <div class="enemy" id="enemy"></div>
        <div class="moves">Moves <b id="b-moves">20</b></div>
      </div>

      <div class="lootbar">
        <span class="lb-label">💰 Loot</span>
        <span id="lootbar-text">nothing yet</span>
      </div>

      <div class="board-wrap" id="battle-wrap">
        <div class="board"></div>
        <div class="board-fx"></div>
        <div class="toast"></div>
      </div>

      <div class="weapons">
        <span class="label">Weapons</span>
        <div id="battle-weapons" class="weapon-tray"></div>
      </div>
      <p class="hint" id="battle-hint"></p>
    </section>

    <!-- CRAFT -->
    <section id="screen-craft" class="screen hidden">
      <div class="forest-top">
        <button class="small" id="craft-back">← Home</button>
        <div class="craft-title">🔨 Camp Workshop <small>Tier 1</small></div>
      </div>
      <div id="craft-list"></div>
    </section>
  </div>

  <!-- Forge animation -->
  <div id="forge" class="forge hidden">
    <div class="forge-stage">
      <div class="forge-rays"></div>
      <div class="forge-item"></div>
      <div class="hammer">🔨</div>
      <div class="anvil"></div>
      <div class="forge-text"></div>
    </div>
  </div>

  <!-- Shared popup -->
  <div id="modal" class="modal hidden">
    <div class="card">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="btns" id="modal-btns"></div>
    </div>
  </div>

  <script src="js/sound.js"></script>
  <script src="js/main.js"></script>
  <script src="js/board.js"></script>
  <script src="js/forest.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/craft.js"></script>
  <script>App.boot();</script>
</body>
</html>
