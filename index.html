<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16201a">
  <title>Warrior Match-3</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Stockpile bar: visible on every screen -->
    <header id="stockbar">
      <div class="res" data-res="wood"><span class="chip c-wood"></span><b id="s-wood">0</b></div>
      <div class="res" data-res="stone"><span class="chip c-stone"></span><b id="s-stone">0</b></div>
      <div class="res" data-res="hide"><span class="chip c-hide"></span><b id="s-hide">0</b></div>
      <div class="res" data-res="gold"><span class="chip c-gold"></span><b id="s-gold">0</b></div>
    </header>

    <!-- HOME -->
    <section id="screen-home" class="screen">
      <h1>Warrior Match-3</h1>
      <p class="sub">Gather → Craft → Fortify → Raid</p>

      <nav class="menu">
        <button class="big" id="btn-forest">🌲 Forest Level</button>
        <button class="big" disabled>🔨 Craft <small>coming in step 3</small></button>
        <button class="big" disabled>⚔️ Raid Goblin Village <small>step 4</small></button>
        <button class="big" disabled>🧱 Fortify <small>step 5</small></button>
        <button class="big" disabled>🛡️ Defend <small>step 6</small></button>
      </nav>

      <div class="panel">
        <h3>Inventory</h3>
        <div id="home-inventory" class="inv"></div>
        <p class="hint">You start with a test Club &amp; Sling so you can try weapons on goblins.</p>
      </div>

      <button class="link" id="btn-reset">Reset save</button>
    </section>

    <!-- FOREST LEVEL -->
    <section id="screen-forest" class="screen hidden">
      <div class="forest-top">
        <button class="small" id="forest-quit">← Home</button>
        <div class="moves">Moves <b id="moves">20</b></div>
      </div>

      <div id="board-wrap">
        <div id="board"></div>
        <div id="board-fx"></div>
        <div id="toast"></div>
      </div>

      <div class="weapons">
        <span class="label">Weapons</span>
        <div id="weapon-tray"></div>
      </div>
      <p class="hint" id="forest-hint">Swap adjacent tiles to match 3+. Swipe or tap two tiles.</p>

      <div id="summary" class="modal hidden">
        <div class="card">
          <h2>Out of moves!</h2>
          <div id="summary-body"></div>
          <div class="row">
            <button class="big" id="sum-again">Play again</button>
            <button class="big alt" id="sum-home">Home</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="js/main.js"></script>
  <script src="js/forest.js"></script>
  <script>App.boot();</script>
</body>
</html>
