<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16201a">
  <title>Warrior Match-3</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Stockpile bar (banked resources at home): visible on every screen -->
    <header id="stockbar">
      <div class="res" data-res="wood"><span class="chip c-wood"></span><b id="s-wood">0</b></div>
      <div class="res" data-res="stone"><span class="chip c-stone"></span><b id="s-stone">0</b></div>
      <div class="res" data-res="hide"><span class="chip c-hide"></span><b id="s-hide">0</b></div>
      <div class="res" data-res="food"><span class="chip c-food"></span><b id="s-food">0</b></div>
      <div class="res" data-res="gold"><span class="chip c-gold"></span><b id="s-gold">0</b></div>
      <div class="res" data-res="iron"><span class="chip c-iron"></span><b id="s-iron">0</b></div>
      <div class="res" data-res="coal"><span class="chip c-coal"></span><b id="s-coal">0</b></div>
      <button id="sound-btn" class="sound-btn" aria-label="Sound">🔊</button>
      <div id="sound-toast" class="sound-toast"></div>
    </header>

    <!-- HOME -->
    <section id="screen-home" class="screen">
      <h1>Warrior Match-3</h1>
      <p class="sub">Gather → Craft → Raid</p>
      <div class="panel level" id="home-level"></div>

      <nav class="menu">
        <h3 class="menu-h">Gather</h3>
        <div class="menu-row">
          <button class="big land forest" id="btn-forest">🌲 Forest<small>wood · hide · food</small></button>
          <button class="big land mine" id="btn-mine">⛏️ Iron Hills<small>stone · iron · coal</small></button>
        </div>
        <button class="big" id="btn-craft">🔨 Workshop</button>
        <h3 class="menu-h">Raid</h3>
        <button class="big danger" id="btn-raid-goblin">⚔️ Raid Goblin Village</button>
        <button class="big danger" id="btn-raid-dwarf">⚒️ Raid Dwarf Stronghold</button>
        <button class="big" id="btn-fortify">🏰 Fortify your camp</button>
      </nav>

      <div class="panel" id="home-inventory"></div>

      <div class="panel debug">
        <h3>🛠 Debug</h3>
        <label class="check"><input type="checkbox" id="dbg-discover"> Tracks / rune stone appear right away</label>
        <label class="check"><input type="checkbox" id="dbg-event"> Thief / runaway cart appears right away</label>
        <button class="big alt" id="dbg-level" style="margin-top:10px">⭐ +1 level</button>
        <button class="big alt" id="dbg-raid" style="margin-top:10px">+1 marked village &amp; stronghold, +8 food</button>
        <button class="big alt" id="dbg-rich" style="margin-top:10px">+20 of every resource</button>
        <button class="link" id="btn-reset">Reset save</button>
      </div>
    </section>

    <!-- GATHERING (Forest / Iron Hills) -->
    <section id="screen-gather" class="screen hidden">
      <div class="forest-top">
        <button class="small" id="g-exit">🏠 Head home</button>
        <div class="land-title" id="g-title"></div>
        <div class="moves">Moves <b id="g-moves">20</b></div>
      </div>
      <div class="backpack" id="backpack"></div>
      <div class="subbar"><span id="g-level"></span><span id="g-finds"></span></div>

      <div class="board-wrap" id="gather-wrap">
        <div class="board"></div>
        <div class="board-fx"></div>
        <div class="toast"></div>
      </div>

      <div class="weapons">
        <span class="label">Weapons</span>
        <div id="gather-weapons" class="weapon-tray"></div>
      </div>
      <p class="hint" id="gather-hint"></p>
    </section>

    <!-- BATTLE (Goblin Village / Dwarf Stronghold) -->
    <section id="screen-battle" class="screen hidden">
      <div class="forest-top">
        <button class="small danger" id="battle-exit">🏳️ Retreat</button>
        <div class="enemy" id="enemy"></div>
        <div class="moves">Move <b id="b-moves">0</b><small id="b-cap">/40</small></div>
      </div>
      <div class="lootbar">
        <span class="lb-label" id="b-title"></span>
        <span id="lootbar-text">nothing yet</span>
      </div>
      <div class="race" id="race">
        <div class="mm-grid" id="race-map"></div>
        <div class="race-info">
          <div class="race-top"><span>🏰 Your camp <span id="race-keep"></span></span><span id="race-them"></span></div>
          <div class="race-log" id="race-log"></div>
        </div>
      </div>

      <div class="board-wrap" id="battle-wrap">
        <div class="board"></div>
        <div class="board-fx"></div>
        <div class="toast"></div>
      </div>

      <div class="weapons">
        <span class="label">Weapons</span>
        <div id="battle-weapons" class="weapon-tray"></div>
      </div>
      <p class="hint" id="battle-hint"></p>
    </section>

    <!-- FORTIFY -->
    <section id="screen-fortify" class="screen hidden">
      <div class="forest-top">
        <button class="small" id="fort-back">← Home</button>
        <div class="craft-title">🏰 Your camp</div>
        <div id="fort-points"></div>
      </div>
      <div class="fort-palette" id="fort-palette"></div>
      <div class="fort-wrap"><div class="fort-grid" id="fort-grid"></div><div class="fort-arrow">⬆ raiders attack from here ⬆</div></div>
      <p class="hint" id="fort-hint"></p>
      <div class="panel fort-panel"><div id="fort-test"></div><div id="fort-chest" class="mt"></div></div>
    </section>

    <!-- WORKSHOP -->
    <section id="screen-craft" class="screen hidden">
      <div class="forest-top">
        <button class="small" id="craft-back">← Home</button>
        <div class="craft-title">🔨 Workshop</div>
      </div>
      <div id="craft-list"></div>
    </section>
  </div>

  <!-- Forge animation -->
  <div id="forge" class="forge hidden">
    <div class="forge-stage">
      <div class="forge-rays"></div>
      <div class="forge-item"></div>
      <div class="hammer">🔨</div>
      <div class="anvil"></div>
      <div class="forge-text"></div>
    </div>
  </div>

  <!-- Shared popup -->
  <div id="modal" class="modal hidden">
    <div class="card">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="btns" id="modal-btns"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/art.js"></script>
  <script src="js/board.js"></script>
  <script src="js/main.js"></script>
  <script src="js/gather.js"></script>
  <script src="js/camp.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/craft.js"></script>
  <script>App.boot();</script>
</body>
</html>
