<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16201a">
  <title>Tile Realm</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- TITLE & CHARACTER CREATION -->
    <section id="screen-title" class="screen hidden"></section>
    <section id="screen-create" class="screen hidden"></section>

    <!-- JOURNAL -->
    <section id="screen-journal" class="screen hidden">
      <div class="forest-top">
        <button class="small" id="journal-back">← Map</button>
        <div class="craft-title">📜 Journal</div>
      </div>
      <div id="journal-list"></div>
    </section>

    <!-- HOME -->
    <section id="screen-home" class="screen">
      <div class="home-top">
        <div class="home-level" id="home-level"></div>
        <span class="home-btns"><button class="small journal-btn" id="btn-journal">📜 Journal</button><button class="small hero-btn" id="btn-hero">🧍 Warrior</button><button class="small items-btn" id="btn-items">🎒 Items</button><button id="sound-btn" class="small sound-btn" aria-label="Sound">🔊</button></span>
        <div id="sound-toast" class="sound-toast"></div>
      </div>
      <div id="quest-slot"></div>
      <div class="world" id="world">
        <div class="world-map" id="world-map"></div>
        <div class="world-spots" id="world-spots"></div>
        <div class="hero" id="hero"><span>🛡️</span></div>
      </div>
      <p class="hint">Tap a place on the map to travel there.</p>

      <details class="panel debug">
        <summary>🛠 Debug</summary>
        <label class="check"><input type="checkbox" id="dbg-discover"> Tracks / rune stone appear right away</label>
        <label class="check"><input type="checkbox" id="dbg-event"> Thief / cart / crab appears right away</label>
        <button class="big alt" id="dbg-level" style="margin-top:10px">⭐ +1 level</button>
        <button class="big alt" id="dbg-raid" style="margin-top:10px">+1 marked village &amp; stronghold, +8 food</button>
        <button class="big alt" id="dbg-rich" style="margin-top:10px">+20 of every resource</button>
        <button class="link" id="btn-reset">Reset save</button>
      </details>
    </section>

    <!-- ITEMS -->
    <section id="screen-items" class="screen hidden">
      <div class="forest-top">
        <button class="small" id="items-back">← Map</button>
        <div class="craft-title">🎒 Items</div>
      </div>
      <div class="itabs">
        <button class="itab on" data-tab="special">✨ Special</button>
        <button class="itab" data-tab="materials">🪵 Materials</button>
        <button class="itab" data-tab="gear">⚔️ Gear</button>
      </div>
      <div id="items-list"></div>
    </section>

    <!-- GATHERING (Forest / Iron Hills) -->
    <section id="screen-gather" class="screen hidden">
      <div class="forest-top">
        <button class="small" id="g-exit">🏠 Head home</button>
        <div class="land-title" id="g-title"></div>
        <div class="moves">Moves <b id="g-moves">20</b></div>
      </div>
      <div class="subbar"><button class="bp-btn" id="bp-btn">🎒 <b id="bp-total">0</b><small id="bp-cap">/30</small></button><span id="g-level"></span><span id="g-finds"></span></div>

      <div class="board-wrap" id="gather-wrap">
        <div class="board"></div>
        <div class="board-fx"></div>
        <div class="toast"></div>
        <div class="bp-pop hidden" id="bp-pop"></div>
      </div>

      <div class="weapons">
        
        <div id="gather-weapons" class="weapon-tray"></div>
      </div>
      <p class="hint" id="gather-hint"></p>
    </section>

    <!-- BATTLE (Goblin Village / Dwarf Stronghold) -->
    <section id="screen-battle" class="screen hidden">
      <div class="forest-top">
        <button class="small danger" id="battle-exit">🏳️ Retreat</button>
        <div class="enemy" id="enemy"></div>
        <div class="moves">Move <b id="b-moves">0</b><small id="b-cap">/40</small></div>
      </div>
      <div class="lootbar">
        <span class="lb-label" id="b-title"></span>
        <span id="lootbar-text">nothing yet</span>
      </div>
      <div class="race" id="race">
        <div class="mm-grid" id="race-map"></div>
        <div class="race-info">
          <div class="race-top"><span>🏰 Your camp <span id="race-keep"></span></span><span id="race-them"></span></div>
          <div class="race-log" id="race-log"></div>
        </div>
      </div>

      <div class="board-wrap" id="battle-wrap">
        <div class="board"></div>
        <div class="board-fx"></div>
        <div class="toast"></div>
      </div>

      <div class="weapons">
        
        <div id="battle-weapons" class="weapon-tray"></div>
      </div>
      <p class="hint" id="battle-hint"></p>
    </section>

    <!-- FORTIFY -->
    <section id="screen-fortify" class="screen hidden">
      <div class="forest-top">
        <button class="small" id="fort-back">← Map</button>
        <div class="craft-title">🏰 Your camp</div>
        <div id="fort-points"></div>
      </div>
      <div class="fort-palette" id="fort-palette"></div>
      <div class="fort-wrap"><div class="fort-grid" id="fort-grid"></div><div class="fort-arrow">⬆ raiders attack from here ⬆</div></div>
      <p class="hint" id="fort-hint"></p>
      <div class="panel fort-panel"><div id="fort-test"></div><div id="fort-chest" class="mt"></div></div>
      <div class="panel store-panel"><h3 class="store-h">🏦 Storehouse <small>everything you've banked</small></h3><div id="fort-store" class="store"></div></div>
    </section>

    <!-- WORKSHOP -->
    <section id="screen-craft" class="screen hidden">
      <div class="forest-top">
        <button class="small" id="craft-back">← Map</button>
        <div class="craft-title">🔨 Workshop</div>
      </div>
      <div id="craft-list"></div>
    </section>
  </div>

  <!-- Forge animation -->
  <div id="forge" class="forge hidden">
    <div class="forge-stage">
      <div class="forge-rays"></div>
      <div class="forge-item"></div>
      <div class="hammer">🔨</div>
      <div class="anvil"></div>
      <div class="forge-text"></div>
    </div>
  </div>

  <!-- Warrior: full-body equipment -->
  <div id="hero-panel" class="hero-panel hidden">
    <div class="hero-card">
      <div class="hero-top"><b>🧍 Your warrior</b><button class="small" id="hero-close">Done</button></div>
      <div class="doll" id="hero-doll"></div>
      <div class="hero-stats" id="hero-stats"></div>
      <div class="hero-pick" id="hero-pick"></div>
    </div>
  </div>

  <!-- The opening tale -->
  <div id="story" class="story hidden"></div>

  <!-- Shared popup -->
  <div id="modal" class="modal hidden">
    <div class="card">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="btns" id="modal-btns"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/art.js"></script>
  <script src="js/board.js"></script>
  <script src="js/main.js"></script>
  <script src="js/gather.js"></script>
  <script src="js/camp.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/craft.js"></script>
  <script src="js/world.js"></script>
  <script src="js/items.js"></script>
  <script src="js/hero.js"></script>
  <script src="js/story.js"></script>
  <script>App.boot();</script>
</body>
</html>
